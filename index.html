<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Admin Secure Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <!-- Auth Container -->
    <div id="view-auth" class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <h2 id="auth-title" class="text-2xl font-bold text-center mb-6">Admin Login</h2>
        <form id="auth-form" class="space-y-4">
            <input type="text" id="in-name" placeholder="Full Name (Register Only)" class="w-full px-4 py-2 border rounded-lg hidden">
            <input type="email" id="in-email" placeholder="Email Address" class="w-full px-4 py-2 border rounded-lg" required>
            <input type="password" id="in-pass" placeholder="Password" class="w-full px-4 py-2 border rounded-lg" required>
            <button type="submit" id="main-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold">Login</button>
        </form>
        <button onclick="UI.toggleMode()" id="toggle-btn" class="w-full mt-4 text-sm text-blue-600 hover:underline">Need to Create Admin Account?</button>
    </div>

    <!-- Dashboard Container -->
    <div id="view-dashboard" class="hidden w-full h-full p-8">
        <h1 class="text-3xl font-bold mb-4">Nexus Admin Dashboard</h1>
        <div class="bg-white p-6 rounded-lg shadow-sm border">
            <p>Welcome, Administrator. System Operational.</p>
            <button onclick="Auth.logout()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded">Logout</button>
        </div>
    </div>

    <script>
        // -----------------------------------------
        // 1. DATABASE LAYER
        // -----------------------------------------
        const DB = {
            db: null,
            init: () => {
                return new Promise((resolve) => {
                    const req = indexedDB.open('Nexus_Admin_DB', 1);
                    req.onupgradeneeded = e => e.target.result.createObjectStore('users', { keyPath: 'id' });
                    req.onsuccess = e => { DB.db = e.target.result; resolve(); };
                });
            },
            async getAll(store) {
                return new Promise(res => {
                    const tx = DB.db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).getAll();
                    req.onsuccess = () => res(req.result);
                });
            },
            async put(store, data) {
                return new Promise(res => {
                    const tx = DB.db.transaction(store, 'readwrite');
                    tx.objectStore(store).put(data);
                    tx.oncomplete = () => res();
                });
            }
        };

        // -----------------------------------------
        // 2. AUTHENTICATION LAYER
        // -----------------------------------------
        const Auth = {
            async hash(str) {
                const msg = new TextEncoder().encode(str);
                const hash = await crypto.subtle.digest('SHA-256', msg);
                return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
            },
            async register(name, email, pass) {
                const users = await DB.getAll('users');
                if (users.filter(u => u.role === 'admin').length >= 3) return alert('Error: Max 3 Admins reached.');
                if (users.find(u => u.email === email)) return alert('Error: User already exists.');
                
                await DB.put('users', {
                    id: Date.now().toString(),
                    name, email,
                    role: 'admin',
                    password: await Auth.hash(pass)
                });
                alert('Admin Created! You can now login.');
                UI.toggleMode(); // Switch back to login
            },
            async login(email, pass) {
                const users = await DB.getAll('users');
                const user = users.find(u => u.email === email && u.password === await Auth.hash(pass));
                if (user && user.role === 'admin') {
                    document.getElementById('view-auth').classList.add('hidden');
                    document.getElementById('view-dashboard').classList.remove('hidden');
                } else {
                    alert('Invalid Login or Unauthorized.');
                }
            },
            logout: () => location.reload()
        };

        // -----------------------------------------
        // 3. UI LAYER
        // -----------------------------------------
        const UI = {
            isRegistering: false,
            toggleMode: () => {
                UI.isRegistering = !UI.isRegistering;
                document.getElementById('auth-title').innerText = UI.isRegistering ? 'Create Admin' : 'Admin Login';
                document.getElementById('main-btn').innerText = UI.isRegistering ? 'Register' : 'Login';
                document.getElementById('toggle-btn').innerText = UI.isRegistering ? 'Back to Login' : 'Need to Create Admin Account?';
                document.getElementById('in-name').classList.toggle('hidden', !UI.isRegistering);
            }
        };

        // -----------------------------------------
        // 4. BOOTSTRAP
        // -----------------------------------------
        window.onload = async () => {
            await DB.init();
            document.getElementById('auth-form').onsubmit = async (e) => {
                e.preventDefault();
                const name = document.getElementById('in-name').value;
                const email = document.getElementById('in-email').value;
                const pass = document.getElementById('in-pass').value;

                if (UI.isRegistering) {
                    await Auth.register(name, email, pass);
                } else {
                    await Auth.login(email, pass);
                }
            };
        };
    </script>
</body>
</html>
